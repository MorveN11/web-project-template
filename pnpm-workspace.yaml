packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  '@clerk/shared': true
  '@prisma/engines': true
  bufferutil: set this to true or false
  core-js: set this to true or false
  esbuild: true
  prisma: true
  sharp: true
  utf-8-validate: set this to true or false

minimumReleaseAgeExclude:
  - '@clerk/backend@3.11.1'
  - '@clerk/nextjs@7.5.14'
  - '@clerk/react@6.12.0'
  - '@clerk/shared@4.25.0'

# Native build allowlist. Add any package whose postinstall compiles native code.
onlyBuiltDependencies:
  - "@clerk/shared"
  - "@tailwindcss/oxide"
  - "@prisma/client"
  - "@prisma/engines"
  - "core-js"
  - "esbuild"
  - "prisma"
  - "sharp"
  - "unrs-resolver"
