packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  '@clerk/shared': true
  '@prisma/engines': true
  '@sentry/cli': true
  bufferutil: true
  core-js: true
  esbuild: true
  prisma: true
  sharp: true
  utf-8-validate: true

minimumReleaseAgeExclude:
  - '@scalar/client-side-rendering@0.3.7'
  - '@scalar/hono-api-reference@0.11.14'
  - '@scalar/types@0.18.0'
  - hono@4.13.2

# Native build allowlist. Add any package whose postinstall compiles native code.
onlyBuiltDependencies:
  - "@clerk/shared"
  - "@prisma/client"
  - "@prisma/engines"
  - "core-js"
  - "esbuild"
  - "prisma"
  - "sharp"
  - "@tailwindcss/oxide"
  - "unrs-resolver"

# Patches applied via `pnpm patch`. Each entry maps a dependency at a
# pinned version to its patch file under `./patches/`. The patch
# mechanism rewrites the package's installed dist during install, so
# both local dev (`pnpm install`) and the Docker build (which copies
# `./patches` into the build stage before `pnpm install --frozen-lockfile`)
# see the same fixed dist.
#
# Current:
#   - `next-themes@0.4.6`: reroutes the inline `<script>` that prevents
#     the dark/light theme flash through Next.js's `useServerInsertedHTML`
#     so the script ships with the SSR nonce — without the patch the
#     inline `<script>` ignores the nonce and breaks CSP `strict-dynamic`
#     in production. See `patches/next-themes@0.4.6.patch` for the diff.
patchedDependencies:
  next-themes@0.4.6: patches/next-themes@0.4.6.patch
