packages:
  - "apps/*"
  - "packages/*"

# ws@7 (transitive via react-native/metro) requires utf-8-validate@^5.0.2;
# rpc-websockets@9 (via @solana/web3.js) pulls 6.x and conflicts.
# Pin to ^5.0.2 — rpc-websockets treats it as optional, so downgrade falls back to JS.
overrides:
  utf-8-validate: ^5.0.2

allowBuilds:
  '@clerk/shared': true
  '@prisma/engines': true
  bufferutil: true
  core-js: true
  esbuild: true
  prisma: true
  sharp: true
  utf-8-validate: true

minimumReleaseAgeExclude:
  - '@clerk/backend@3.11.1'
  - '@clerk/nextjs@7.5.14'
  - '@clerk/react@6.12.0'
  - '@clerk/shared@4.25.0'

# Native build allowlist. Add any package whose postinstall compiles native code.
onlyBuiltDependencies:
  - "@clerk/shared"
  - "@tailwindcss/oxide"
  - "@prisma/client"
  - "@prisma/engines"
  - "core-js"
  - "esbuild"
  - "prisma"
  - "sharp"
  - "unrs-resolver"
