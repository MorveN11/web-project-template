packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  '@clerk/shared': true
  '@prisma/engines': true
  bufferutil: true
  core-js: true
  esbuild: true
  prisma: true
  sharp: true
  utf-8-validate: true

minimumReleaseAgeExclude:
  - '@scalar/client-side-rendering@0.3.7'
  - '@scalar/hono-api-reference@0.11.14'
  - '@scalar/types@0.18.0'
  - hono@4.13.2

# Native build allowlist. Add any package whose postinstall compiles native code.
onlyBuiltDependencies:
  - "@clerk/shared"
  - "@tailwindcss/oxide"
  - "@prisma/client"
  - "@prisma/engines"
  - "core-js"
  - "esbuild"
  - "prisma"
  - "sharp"
  - "unrs-resolver"
