# Path-based matrix used by release.yml + ci.yml's `changes` job to know
# which services changed. Only `api` and `web` are consumed by workflows;
# the other keys are kept for documentation and future ad-hoc scripts.
#
# ci.yml's `pr-check` job references these outputs directly (not via
# a synthetic `any`) so the trigger is explicit: it runs when api,
# web, shared,config, or ci filter matches. Pure docs changes (README,
# docs/, *.md outside .github/) don't trigger pr-check.

api:
  - "apps/api/**"
  - "packages/shared-types/**"
  - "packages/db/**"

web:
  - "apps/web/**"
  - "packages/shared-types/**"

shared:
  - "packages/**"

config:
  - "package.json"
  - "pnpm-workspace.yaml"
  - "tsconfig*.json"
  - "biome.json"
  - ".github/**"
  - "docker-compose*.yml"
  - ".env*.example"

ci:
  - ".github/workflows/**"
  - "release.config.mjs"
