name: check-pull-request

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ['**']

# amannn/action-semantic-pull-request needs pull-requests: read to fetch
# the PR title and metadata. Without it: "Resource not accessible by
# integration" on every PR

# IMPORTANT: this workflow assumes the repo's merge strategy is set to
# Squash or Rebase only (Allow merge commits: OFF). See CONTRIBUTING.md
# § 1 "Repo settings" for the full rationale. If you re-enable merge
# commits in repo Settings, every PR with a merge in its history will
# fail the commit-messages check (gsactions's `excludeTitle` only
# applies to the PR title, not to individual commit messages).

permissions:
  pull-requests: read

jobs:
  semantic-pull-request:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Title must follow Conventional Commits.
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: '^([^()]+)(?:\(([^()]+)\))?:\s.+$'
          subjectPatternError: |
            Subject does not match Conventional Commits. Expected:
              type(scope): subject

  commit-messages:
    runs-on: ubuntu-latest
    # gsactions/commit-message-checker needs contents: read to fetch the
    # commit history, plus pull-requests: read for PR metadata.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 100
      - name: Verify every commit title
        uses: gsactions/commit-message-checker@v2
        with:
          pattern: '(?:build|style|docs|doc|refactor|test|fix|perf|chore|feat|ci|revert)(?:\(.+\))?:\s[a-zA-Z].+'
          flags: 'g'
          excludeDescription: true
          # v2 renamed this input: was `excludeTitlePattern`, now `excludeTitle`.
          # This is a defense-in-depth net — the merge strategy is
          # configured in repo Settings to disallow merge commits (see
          # CONTRIBUTING.md § 1 "Repo settings"), so the history should
          # never contain "Merge …" commits. If it does (e.g. someone
          # re-enabled merge commits in the repo), this exclude keeps
          # the check from failing on them.
          excludeTitle: '^Merge\b'
          checkAllCommitMessages: true
          # v2 requires an explicit accessToken when checkAllCommitMessages
          # is true. Without it: "HttpError: Bad credentials". Pass the
          # default GITHUB_TOKEN.
          accessToken: ${{ secrets.GITHUB_TOKEN }}
          # v2 renamed this input: was `errorMessage`, now `error`.
          error: |
            All commit messages must follow Conventional Commits.
            Allowed types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert.
            Required format: type(scope): subject
