name: release-test

on:
  push:
    branches: [test]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write
  id-token: write

concurrency:
  group: release-test
  cancel-in-progress: false

# Push to `test` → prerelease channel release (e.g. vX.Y.Z-test.N).
# Each pushed image is redeployed to the test environment via Dokploy.
# Tag uses `-test` suffix and `buildcache-test` cache namespace to keep it
# isolated from the prod builds.

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      new_tag: ${{ steps.semantic.outputs.new_release_version || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v8
        id: semantic
        # extra_plugins declares everything semantic-release needs at
        # runtime — nothing in this repo has to install them as deps.
        with:
          extra_plugins: |
            @semantic-release/commit-analyzer
            @semantic-release/release-notes-generator
            @semantic-release/github
            conventional-changelog-conventionalcommits
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      # Top-level config changes force both services to rebuild even when
      # neither apps/api nor apps/web changed (package.json, biome.json,
      # .github/**, docker-compose, .env*.example, etc.).
      config: ${{ steps.filter.outputs.config }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: '.github/filters.yml'

  build-and-push:
    needs: [release, changes]
    runs-on: ubuntu-latest
    env:
      # Job-level so the source-maps step (after the docker push) can
      # resolve IMAGE_NAMESPACE — step-level env doesn't propagate.
      IMAGE_NAMESPACE: ${{ vars.IMAGE_NAMESPACE || secrets.DOCKERHUB_USERNAME }}
    strategy:
      fail-fast: false
      matrix:
        service:
          - id: api
            name: api
            context: .
            dockerfile: apps/api/Dockerfile
            webhook_secret: DOKPLOY_DEPLOY_WEBHOOK_API_TEST
            # GlitchTip project SLUG — passed to `getsentry/action-release@v3`
            # as `SENTRY_PROJECT`. GlitchTip's `/api/0/projects/{org}/{slug}/`
            # only resolves slugs, not numeric ids. Read from a per-env GitHub
            # variable (set in repo Settings → Secrets and variables →
            # Variables) so the slug can change without re-touching YAML.
            sentry_project: ${{ vars.SENTRY_PROJECT_API_TEST }}
          - id: web
            name: web
            context: .
            dockerfile: apps/web/Dockerfile
            webhook_secret: DOKPLOY_DEPLOY_WEBHOOK_WEB_TEST
            sentry_project: ${{ vars.SENTRY_PROJECT_WEB_TEST }}
    steps:
      - name: Should this service build?
        id: should_run
        env:
          # Service's own filter (api|web). Top-level config changes force
          # both services to rebuild even when neither app dir changed.
          SERVICE: ${{ needs.changes.outputs[matrix.service.id] }}
          CONFIG: ${{ needs.changes.outputs.config }}
        run: |
          if [ "$SERVICE" = "true" ] || [ "$CONFIG" = "true" ]; then
            echo "should_run=true" >>"$GITHUB_OUTPUT"
          else
            echo "should_run=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.should_run.outputs.should_run == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        if: steps.should_run.outputs.should_run == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: steps.should_run.outputs.should_run == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push (test)
        if: steps.should_run.outputs.should_run == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          platforms: linux/amd64
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY_TEST }}
            NEXT_PUBLIC_CLERK_SIGN_IN_URL=${{ secrets.NEXT_PUBLIC_CLERK_SIGN_IN_URL }}
            NEXT_PUBLIC_CLERK_SIGN_UP_URL=${{ secrets.NEXT_PUBLIC_CLERK_SIGN_UP_URL }}
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_TEST_API_URL }}
            # Public site URL — baked into metadataBase, OG url, sitemap,
            # canonical. MUST be the test/staging hostname here, otherwise
            # the test bundle points at prod (default fallback).
            NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL_TEST }}
            # Build-time only (source map upload). Empty = no source maps.
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
            # Non-sensitive identifiers — read from `vars.*` (set in
            # repo settings) instead of hardcoding the org in YAML.
            # Project ID + URL are parsed from the DSN by the consumer
            # (next.config.ts for web, the upload step for api) — the
            # DSN format `https://<key>@<host>/<project_id>` carries
            # both. Release name shared by api + web (same matrix
            # builds against the same `release` job output).
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            # GlitchTip base URL — forwarded to `withSentryConfig` as
            # `sentryUrl` (web) and read by the api upload step's
            # `SENTRY_URL` env. Same value as `vars.SENTRY_URL`.
            NEXT_PUBLIC_SENTRY_URL=${{ vars.SENTRY_URL }}
            SENTRY_RELEASE=${{ needs.release.outputs.new_tag }}-build-${{ matrix.service.id }}
            # GlitchTip / Sentry — inlined into the JS bundle at build time.
            # Test deploys track errors + metrics just like prod, so
            # testing-env bugs surface in GlitchTip before they ship.
            # The environment tag (`testing`) keeps them separable
            # from prod events in the GlitchTip UI.
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN_TEST }}
            NEXT_PUBLIC_SENTRY_ENVIRONMENT=testing
            NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE=0.01
            # GlitchTip project SLUG — `withSentryConfig` forwards it to
            # `@sentry/cli` as `--project`. Read from the same per-env var
            # the api upload step uses (see matrix above).
            NEXT_PUBLIC_SENTRY_PROJECT=${{ vars.SENTRY_PROJECT_WEB_TEST }}
            # Frontend logger threshold — inlined into the JS bundle at
            # build time by `env/client.ts`. `info` for testing: keeps
            # every `info`/`warn`/`error` from api-client + logger,
            # useful to debug real deploys without the noise of `debug`.
            NEXT_PUBLIC_LOG_LEVEL=info
            # NO Umami build args here — Umami tracks REAL traffic data
            # (page views, sessions, conversions). Test deploys deliberately
            # omit it; the <UmamiScript /> NODE_ENV gate + empty-value
            # guard ensures no script renders on test.
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/${{ matrix.service.name }}:test
            ${{ env.IMAGE_NAMESPACE }}/${{ matrix.service.name }}:${{ needs.release.outputs.new_tag }}-build
          cache-from: type=registry,ref=${{ env.IMAGE_NAMESPACE }}/${{ matrix.service.name }}:buildcache-test
          cache-to: type=registry,ref=${{ env.IMAGE_NAMESPACE }}/${{ matrix.service.name }}:buildcache-test,mode=max

      - name: Extract api dist from image
        if: matrix.service.id == 'api' && steps.should_run.outputs.should_run == 'true'
        shell: bash
        env:
          IMAGE: ${{ env.IMAGE_NAMESPACE }}/${{ matrix.service.name }}:${{ needs.release.outputs.new_tag }}-build
        run: |
          # The api image's entrypoint runs prisma migrations + boots
          # the node service. Override to /bin/true so `docker create`
          # exits immediately without starting the api — we only need
          # the dist/ directory that esbuild emitted during the build.
          CID=$(docker create --entrypoint /bin/true "$IMAGE")
          docker cp "$CID":/app/apps/api/dist ./dist
          docker rm "$CID" >/dev/null

      - name: Upload api source maps to GlitchTip
        if: matrix.service.id == 'api' && steps.should_run.outputs.should_run == 'true'
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          # GlitchTip base URL. Not a secret — the hostname is public.
          # `SENTRY_PROJECT` per matrix entry. Action uses these to
          # resolve all CLI calls (`https://<url>/api/0/...`).
          SENTRY_URL: ${{ vars.SENTRY_URL }}
          SENTRY_PROJECT: ${{ matrix.service.sentry_project }}
        with:
          release: ${{ needs.release.outputs.new_tag }}-build-${{ matrix.service.id }}
          sourcemaps: ./dist
          set_commits: auto
          # First-ever release has no previous tag; without this the
          # `set_commits auto` step would fail the whole upload.
          ignore_missing: 'true'

      - name: Trigger Dokploy (test)
        if: steps.should_run.outputs.should_run == 'true'
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          WEBHOOK: ${{ secrets[matrix.service.webhook_secret] }}
          SERVICE: ${{ matrix.service.name }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::No test webhook for $SERVICE"
            exit 0
          fi
          echo "[test] Triggering Dokploy for $SERVICE (webhook: $WEBHOOK)..."
          curl -L -X GET --fail-with-body "$DOKPLOY_URL/api/deploy/$WEBHOOK"
          echo

      - name: Post run summary (test)
        if: steps.should_run.outputs.should_run == 'true'
        env:
          NS: ${{ vars.IMAGE_NAMESPACE || secrets.DOCKERHUB_USERNAME }}
          SERVICE: ${{ matrix.service.name }}
          # Two tags pushed: channel marker (`:test`) and versioned
          # artifact (`:<semver>-test.N-build`). Show both.
          VERSION_TAG: ${{ needs.release.outputs.new_tag }}-build
          CHANNEL_TAG: test
        run: |
          {
            echo "## Released \`${SERVICE}@${VERSION_TAG}\` (test)"
            echo ""
            echo "| Tag | Image |"
            echo "| --- | --- |"
            echo "| \`:${CHANNEL_TAG}\` | \`${NS}/${SERVICE}:${CHANNEL_TAG}\` |"
            echo "| \`:${VERSION_TAG}\` | \`${NS}/${SERVICE}:${VERSION_TAG}\` |"
          } >> "$GITHUB_STEP_SUMMARY"