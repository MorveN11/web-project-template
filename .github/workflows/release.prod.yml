name: release-prod

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write
  id-token: write

concurrency:
  group: release-prod
  cancel-in-progress: false

# Push to `main` → stable channel release.
# Each pushed image is redeployed to the prod environment via Dokploy.

jobs:
  release:
    # Opt-in: set repo variable ENABLE_RELEASES=true once the secrets in
    # .github/SECRETS.md exist. Unset = whole workflow skips (green).
    if: ${{ vars.ENABLE_RELEASES == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      new_tag: ${{ steps.semantic.outputs.new_release_version || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v6
        id: semantic
        # extra_plugins declares everything semantic-release needs at
        # runtime — nothing in this repo has to install them as deps.
        with:
          extra_plugins: |
            @semantic-release/commit-analyzer
            @semantic-release/release-notes-generator
            @semantic-release/github
            conventional-changelog-conventionalcommits
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  changes:
    if: ${{ vars.ENABLE_RELEASES == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      # Top-level config changes force both services to rebuild even when
      # neither apps/api nor apps/web changed (package.json, biome.json,
      # .github/**, docker-compose, .env*.example, etc.).
      config: ${{ steps.filter.outputs.config }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: '.github/filters.yml'

  build-and-push:
    needs: [release, changes]
    runs-on: ubuntu-latest
    env:
      IMAGE_NAMESPACE: ${{ vars.IMAGE_NAMESPACE || secrets.DOCKERHUB_USERNAME }}
    strategy:
      fail-fast: false
      # Serialized on purpose: serializing api→web avoids races during
      # container swap when the web image calls the live api at build
      # time. Matrix order is api → web. Forks that don't pre-render
      # against the api can drop this back to default parallelism.
      max-parallel: 1
      matrix:
        service:
          - id: api
            name: api
            context: .
            dockerfile: apps/api/Dockerfile
            webhook_secret: DOKPLOY_DEPLOY_WEBHOOK_API_PROD
          - id: web
            name: web
            context: .
            dockerfile: apps/web/Dockerfile
            webhook_secret: DOKPLOY_DEPLOY_WEBHOOK_WEB_PROD
    steps:
      - name: Should this service build?
        id: should_run
        env:
          # Service's own filter (api|web). Top-level config changes force
          # both services to rebuild even when neither app dir changed.
          SERVICE: ${{ needs.changes.outputs[matrix.service.id] }}
          CONFIG: ${{ needs.changes.outputs.config }}
        run: |
          if [ "$SERVICE" = "true" ] || [ "$CONFIG" = "true" ]; then
            echo "should_run=true" >>"$GITHUB_OUTPUT"
          else
            echo "should_run=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.should_run.outputs.should_run == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        if: steps.should_run.outputs.should_run == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: steps.should_run.outputs.should_run == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Wait for api before building web
        if: matrix.service.id == 'web' && steps.should_run.outputs.should_run == 'true'
        env:
          API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: .github/scripts/wait-api-healthy.sh "$API_URL"

      - name: Build & push (prod)
        if: steps.should_run.outputs.should_run == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          platforms: linux/amd64
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY_PROD }}
            NEXT_PUBLIC_CLERK_SIGN_IN_URL=${{ secrets.NEXT_PUBLIC_CLERK_SIGN_IN_URL }}
            NEXT_PUBLIC_CLERK_SIGN_UP_URL=${{ secrets.NEXT_PUBLIC_CLERK_SIGN_UP_URL }}
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            # Public site URL — baked into metadataBase, OG url, sitemap,
            # canonical. Required for Google OAuth domain matching.
            NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL_PROD }}
            # Non-sensitive identifiers — read from `vars.*` (set in
            # repo settings) instead of hardcoding the org in YAML.
            # Source maps ship disabled by default (see next.config.ts) —
            # these only matter for forks that re-enable upload, which
            # also needs restoring `SENTRY_AUTH_TOKEN`. Release name
            # shared by api + web (same matrix builds against the same
            # `release` job output), still used for event tagging.
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            # GlitchTip base URL — forwarded to `withSentryConfig` as
            # `sentryUrl`. Same value as `vars.SENTRY_URL`.
            NEXT_PUBLIC_SENTRY_URL=${{ vars.SENTRY_URL }}
            SENTRY_RELEASE=${{ needs.release.outputs.new_tag }}-${{ matrix.service.id }}
            # GlitchTip / Sentry — inlined into the JS bundle at build time.
            # Both prod + test envs wire to GlitchTip (errors + metrics
            # in both). Environment hardcoded per workflow (not a secret)
            # so GlitchTip UI filters by `production` vs `testing`.
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN_PROD }}
            NEXT_PUBLIC_SENTRY_ENVIRONMENT=production
            NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE=0.01
            # GlitchTip project SLUG — `withSentryConfig` forwards it to
            # `@sentry/cli` as `--project`. Read from the same per-env var
            # the api upload step uses (see matrix above).
            NEXT_PUBLIC_SENTRY_PROJECT=${{ vars.SENTRY_PROJECT_WEB_PROD }}
            # Frontend logger threshold — inlined into the JS bundle at
            # build time by `env/client.ts`. `warn` for production:
            # drops `debug` + `info`, keeps `warn` + `error` so GlitchTip
            # + browser console only show actionable signals.
            NEXT_PUBLIC_LOG_LEVEL=warn
            # Umami analytics — PRODUCTION ONLY. Test deploys deliberately
            # omit these (release.test.yml has no Umami args); the
            # <UmamiScript /> gate still triggers for non-dev builds
            # when the values are empty, so test deploys don't track.
            NEXT_PUBLIC_UMAMI_SCRIPT_URL=${{ secrets.NEXT_PUBLIC_UMAMI_SCRIPT_URL }}
            NEXT_PUBLIC_UMAMI_WEBSITE_ID=${{ secrets.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/${{ matrix.service.name }}:stable
            ${{ env.IMAGE_NAMESPACE }}/${{ matrix.service.name }}:${{ needs.release.outputs.new_tag }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAMESPACE }}/${{ matrix.service.name }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAMESPACE }}/${{ matrix.service.name }}:buildcache,mode=max

      - name: Record api uptime before deploy
        id: api_uptime
        if: matrix.service.id == 'api' && steps.should_run.outputs.should_run == 'true'
        env:
          API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: |
          # Used to detect the container swap: the new process reports a
          # LOWER uptime than the one answering right now.
          uptime=$(curl -fsS --max-time 10 "${API_URL%/}/health" | grep -oE '"uptime_seconds"[[:space:]]*:[[:space:]]*[0-9]+' | grep -oE '[0-9]+$' || true)
          echo "prev=${uptime:-0}" >>"$GITHUB_OUTPUT"

      - name: Trigger Dokploy (prod)
        if: steps.should_run.outputs.should_run == 'true'
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          WEBHOOK: ${{ secrets[matrix.service.webhook_secret] }}
          SERVICE: ${{ matrix.service.name }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::No prod webhook for $SERVICE"
            exit 0
          fi
          echo "[prod] Triggering Dokploy for $SERVICE (webhook: $WEBHOOK)..."
          curl -L -X GET --fail-with-body "$DOKPLOY_URL/api/deploy/$WEBHOOK"
          echo

      - name: Wait for api deploy to settle
        if: matrix.service.id == 'api' && steps.should_run.outputs.should_run == 'true'
        env:
          API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          PREV_UPTIME: ${{ steps.api_uptime.outputs.prev }}
        run: .github/scripts/wait-api-healthy.sh "$API_URL" "$PREV_UPTIME"

      - name: Post run summary (prod)
        if: steps.should_run.outputs.should_run == 'true'
        env:
          NS: ${{ vars.IMAGE_NAMESPACE || secrets.DOCKERHUB_USERNAME }}
          SERVICE: ${{ matrix.service.name }}
          # Two tags pushed: channel marker (`:stable`) and versioned
          # artifact (`:<semver>`). Show both. Same env block as test
          # so the structure stays consistent across release workflows.
          VERSION_TAG: ${{ needs.release.outputs.new_tag }}
          CHANNEL_TAG: stable
        run: |
          {
            echo "## Released \`${SERVICE}@${VERSION_TAG}\` (prod)"
            echo ""
            echo "| Tag | Image |"
            echo "| --- | --- |"
            echo "| \`:${CHANNEL_TAG}\` | \`${NS}/${SERVICE}:${CHANNEL_TAG}\` |"
            echo "| \`:${VERSION_TAG}\` | \`${NS}/${SERVICE}:${VERSION_TAG}\` |"
          } >> "$GITHUB_STEP_SUMMARY"