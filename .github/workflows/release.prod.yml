name: release-prod

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write
  id-token: write

concurrency:
  group: release-prod
  cancel-in-progress: false

# Push to `main` → stable channel release.
# Each pushed image is redeployed to the prod environment via Dokploy.

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      new_tag: ${{ steps.semantic.outputs.new_release_version || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v6
        id: semantic
        # extra_plugins declares everything semantic-release needs at
        # runtime — nothing in this repo has to install them as deps.
        with:
          extra_plugins: |
            @semantic-release/commit-analyzer
            @semantic-release/release-notes-generator
            @semantic-release/github
            conventional-changelog-conventionalcommits
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: '.github/filters.yml'

  build-and-push:
    needs: [release, changes]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - id: api
            name: api
            context: .
            dockerfile: apps/api/Dockerfile
            webhook_secret: DOKPLOY_DEPLOY_WEBHOOK_API_PROD
          - id: web
            name: web
            context: .
            dockerfile: apps/web/Dockerfile
            webhook_secret: DOKPLOY_DEPLOY_WEBHOOK_WEB_PROD
    steps:
      - name: Should this service build?
        id: should_run
        run: |
          SHOULD_RUN="${{ needs.changes.outputs[matrix.service.id] }}"
          echo "should_run=$SHOULD_RUN" >>"$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.should_run.outputs.should_run == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        if: steps.should_run.outputs.should_run == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.should_run.outputs.should_run == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push (prod)
        if: steps.should_run.outputs.should_run == 'true'
        env:
          # IMAGE_NAMESPACE lets forks publish under a different namespace
          # than their Docker Hub username (e.g. org-owned repos). Falls back
          # to DOCKERHUB_USERNAME when the variable is unset.
          IMAGE_NAMESPACE: ${{ vars.IMAGE_NAMESPACE || secrets.DOCKERHUB_USERNAME }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          platforms: linux/amd64
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            CLERK_SECRET_KEY=${{ secrets.CLERK_SECRET_KEY }}
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/${{ matrix.service.name }}:stable
            ${{ env.IMAGE_NAMESPACE }}/${{ matrix.service.name }}:${{ needs.release.outputs.new_tag }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAMESPACE }}/${{ matrix.service.name }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAMESPACE }}/${{ matrix.service.name }}:buildcache,mode=max

      - name: Trigger Dokploy (prod)
        if: steps.should_run.outputs.should_run == 'true'
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          WEBHOOK: ${{ secrets[matrix.service.webhook_secret] }}
          SERVICE: ${{ matrix.service.name }}
          VERSION: ${{ needs.release.outputs.new_tag }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::No prod webhook for $SERVICE"
            exit 0
          fi
          echo "[prod] Triggering Dokploy for $SERVICE (webhook: $WEBHOOK)..."
          curl -L -X GET --fail-with-body "$DOKPLOY_URL/api/deploy/$WEBHOOK"
          echo

      - name: Post run summary (prod)
        if: steps.should_run.outputs.should_run == 'true'
        env:
          NS: ${{ vars.IMAGE_NAMESPACE || secrets.DOCKERHUB_USERNAME }}
          SERVICE: ${{ matrix.service.name }}
          VERSION: ${{ needs.release.outputs.new_tag }}
        run: |
          echo "## Released \`${SERVICE}@${VERSION}\` (prod)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tag | Image |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`:stable\` | \`${NS}/${SERVICE}:stable\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`:${VERSION}\` | \`${NS}/${SERVICE}:${VERSION}\` |" >> "$GITHUB_STEP_SUMMARY"
