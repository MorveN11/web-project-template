name: Bug report
description: Something in the template is broken or behaves unexpectedly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. If you've already changed a lot of the template for
        your own project, please reproduce the issue against a fresh clone first —
        this repo only tracks bugs in the template itself.

  - type: dropdown
    id: package
    attributes:
      label: Where does it happen?
      options:
        - apps/api
        - apps/web
        - packages/db
        - packages/shared-types
        - CI/CD (.github/workflows)
        - Docker / compose
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you expected vs. what actually happened.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact commands from a fresh clone (`pnpm install`, `pnpm dev`, etc.) and any env vars set.
      placeholder: |
        1. pnpm install
        2. pnpm compose
        3. pnpm dev:api
        4. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / error output
      render: shell

  - type: input
    id: node-version
    attributes:
      label: Node version
      placeholder: "24.x"
    validations:
      required: false

  - type: input
    id: pnpm-version
    attributes:
      label: pnpm version
      placeholder: "11.x"
    validations:
      required: false
