# Prod / prod-test compose — full stack built from local Dockerfiles or
# pre-built images (pass `API_IMAGE=ghcr.io/<org>/<repo>/api:<tag>` and
# `WEB_IMAGE=...` to pull from a registry instead of building).
#
# Use this to validate the closest-to-production model locally before
# pushing to the CI/release workflow.
#
# Usage:
#   pnpm compose:prod            # docker compose -f docker-compose.prod.yml --env-file .env up -d --build
#   pnpm compose:prod:down       # teardown

name: web-project-template-prod

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-web_project_template}
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-web_project_template}
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - web-project-template-net

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: ${API_IMAGE:-web-project-template-api:local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_QUERIES: ${LOG_QUERIES:-false}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-web_project_template}?schema=public
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES}
      CORS_ORIGIN: ${CORS_ORIGIN}
      SEED_ENABLED: ${SEED_ENABLED:-false}
    expose:
      - "4000"
    networks:
      - web-project-template-net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: ${WEB_IMAGE:-web-project-template-web:local}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      API_URL: http://api:4000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /auth/iniciar-sesion
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /auth/registro
    ports:
      - "${WEB_HOST_PORT:-3000}:3000"
    networks:
      - web-project-template-net

volumes:
  postgres-data:
    name: web-project-template-postgres

networks:
  web-project-template-net:
    name: web-project-template-prod
    driver: bridge