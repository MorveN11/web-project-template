# Prod / prod-test compose — full stack built from local Dockerfiles or
# pre-built images (pass `API_IMAGE=ghcr.io/<org>/<repo>/api:<tag>` and
# `WEB_IMAGE=...` to pull from a registry instead of building).
#
# Use this to validate the closest-to-production model locally before
# pushing to the CI/release workflow.
#
# Usage:
#   pnpm compose:prod            # docker compose -f docker-compose.prod.yml --env-file .env up -d --build
#   pnpm compose:prod:down       # teardown
#
# Logging: every service uses the json-file driver with rotation
# (10 MB × 3 files per service). Without rotation the default
# json-file driver fills the disk over months. Forks that ship to a
# log aggregator (Datadog, Loki, etc.) should switch the driver to the
# aggregator's plugin and drop the json-file limits.

name: web-project-template-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-web_project_template}
    expose:
      - "5432"
    volumes:
      - ./.containers/postgres-prod:/var/lib/postgresql
    # Single healthcheck in this compose file. Gated so the api doesn't
    # start until postgres is actually accepting connections — without
    # it, the api boots before postgres is ready, the entrypoint runs
    # `prisma migrate deploy`, and Prisma fails with ECONNREFUSED.
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-web_project_template}
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging
    networks:
      - web-project-template-net

  redis:
    # L2 cache for the api's Clerk-user memo. Persistence off — this
    # is a cache, not a source of truth.
    image: redis:8.10-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    expose:
      - "6379"
    volumes:
      - ./.containers/redis-prod:/data
    logging: *default-logging
    networks:
      - web-project-template-net

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: ${API_IMAGE:-web-project-template-api:local}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      # Hard-pin production-mode vars — `pnpm compose:prod` reads
      # root .env (which sets NODE_ENV=development for local dev).
      # Letting that leak in here makes logger.ts pick the
      # pino-pretty transport at runtime, which then crashes because
      # the slim image has no pino-pretty installed.
      NODE_ENV: production
      PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_QUERIES: ${LOG_QUERIES:-false}
      # Force the in-container hostname to the postgres service. Without
      # this, a `DATABASE_URL=localhost:5440` set in the host .env wins
      # the substitution and the api can't reach the db (container
      # localhost != host localhost).
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-web_project_template}?schema=public
      # Same hard-pin as DATABASE_URL: redis URL must use the compose
      # service name. Without this, a host-side REDIS_URL leaks in and
      # the api can't reach redis from inside the container.
      REDIS_URL: redis://redis:6379
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES}
      # CORS_ORIGIN must match the URL the browser hits — host-side.
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:${WEB_HOST_PORT:-3000}}
      # Boot-time seed flag. Hard-pinned on so every fresh deployment
      # creates admin@template.test on an empty DB. Flip to "false"
      # in environments that don't want the seed.
      SEED_ENABLED: "true"
    ports:
      - "${API_HOST_PORT:-4000}:8080"
    # Hit the in-container /health endpoint so the web service can wait
    # for the api to actually be ready (not just started).
    logging: *default-logging
    networks:
      - web-project-template-net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # In-container URL the bundled JS uses to call the api. ALWAYS
        # the compose service name + port, NEVER the host-side
        # NEXT_PUBLIC_API_URL — that's what the browser sees, not
        # what the web container uses. Setting this to localhost
        # makes every api request fail at runtime (syncSelf 404 loop).
        NEXT_PUBLIC_API_URL: http://api:8080
        NEXT_PUBLIC_LOG_LEVEL: ${NEXT_PUBLIC_LOG_LEVEL:-info}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${NEXT_PUBLIC_CLERK_SIGN_IN_URL:-/auth/iniciar-sesion}
        NEXT_PUBLIC_CLERK_SIGN_UP_URL: ${NEXT_PUBLIC_CLERK_SIGN_UP_URL:-/auth/registro}
        # No CLERK_SECRET_KEY here: build args land in the image history.
        # It's a runtime-only secret — see the `environment:` block below.
    image: ${WEB_IMAGE:-web-project-template-web:local}
    depends_on:
      api:
        condition: service_started
    environment:
      # Same hard-pin as api: don't let dev .env leak in.
      NODE_ENV: production
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${NEXT_PUBLIC_CLERK_SIGN_IN_URL:-/auth/iniciar-sesion}
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: ${NEXT_PUBLIC_CLERK_SIGN_UP_URL:-/auth/registro}
    ports:
      - "${WEB_HOST_PORT:-3000}:8080"
    logging: *default-logging
    networks:
      - web-project-template-net

networks:
  web-project-template-net:
    name: web-project-template-prod
    driver: bridge
